<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 400 400" width="400" height="400">
  <title>Edwin Arias avatar</title>
  <style>
    .body  { transform-origin: 200px 420px; animation: breathe 4s ease-in-out infinite; }
    .head  { transform-origin: 200px 322px; animation: sway 6s ease-in-out infinite; }
    .eyes  { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    .brows { animation: brows 7s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
    @keyframes sway {
      0%,100% { transform: rotate(0deg) translateY(0); }
      25%     { transform: rotate(2.2deg) translateY(-2px); }
      50%     { transform: rotate(0deg) translateY(1px); }
      75%     { transform: rotate(-2.2deg) translateY(-2px); }
    }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
    @keyframes brows { 0%,80%,100% { transform: translateY(0); } 86%,92% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .body,.head,.eyes,.brows { animation: none; } }
  </style>
  <rect y="0" width="400" height="440" fill="#ffffff"/>

  <!-- body: hoodie -->
  <g class="body">
    <g transform="translate(0 22)">
      <path d="M30 400 C30 342 105 316 168 308 L232 308 C295 316 370 342 370 400 Z" fill="#1f3b5c"/>
      <path d="M146 326 C140 300 166 288 200 288 C234 288 260 300 254 326 C244 346 156 346 146 326 Z" fill="#14283f"/>
      <!-- drawstrings -->
      <path d="M186 346 L184 376" stroke="#f1f1f1" stroke-width="3" stroke-linecap="round"/>
      <path d="M214 346 L216 376" stroke="#f1f1f1" stroke-width="3" stroke-linecap="round"/>
      <circle cx="184" cy="379" r="3" fill="#f1f1f1"/>
      <circle cx="216" cy="379" r="3" fill="#f1f1f1"/>
      <!-- Python -->
      <text x="200" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#ffd43b">Python</text>
    </g>
  </g>

  <!-- neck + hood collar -->
  <path d="M168 270 L168 336 Q200 358 232 336 L232 270 Z" fill="#c98f6b"/>
  <path d="M168 300 Q200 330 232 300 L232 314 Q200 346 168 314 Z" fill="#b57a58" opacity="0.55"/>
  <path d="M154 326 Q200 372 246 326" fill="none" stroke="#0f2438" stroke-width="13" stroke-linecap="round"/>

  <g class="head">
    <!-- ears -->
    <ellipse cx="125" cy="196" rx="12" ry="21" fill="#d9a07c"/>
    <ellipse cx="275" cy="196" rx="12" ry="21" fill="#d9a07c"/>
    <ellipse cx="125" cy="198" rx="5" ry="11" fill="#c28660" opacity="0.7"/>
    <ellipse cx="275" cy="198" rx="5" ry="11" fill="#c28660" opacity="0.7"/>

    <!-- face: longer, angular jaw -->
    <path d="M126 180 C126 86 274 86 274 180 C274 252 244 314 200 322 C156 314 126 252 126 180 Z" fill="#e0a883"/>
    <path d="M126 190 C128 252 154 310 200 322 C172 302 148 258 142 196 Z" fill="#c98f6b" opacity="0.35"/>

    <!-- hair (visible at the sides under the cap) -->
    <path d="M122 176 C112 112 146 76 204 78 C262 80 292 116 278 176 C272 152 262 138 248 130 C222 118 176 120 152 132 C136 142 128 156 122 176 Z" fill="#1a1512"/>
    <path d="M122 176 C123 160 128 150 136 142 L138 190 Z" fill="#3a2f28" opacity="0.55"/>
    <path d="M278 176 C277 160 272 150 264 142 L262 190 Z" fill="#3a2f28" opacity="0.55"/>

    <!-- cap with E -->
    <path d="M118 150 C114 58 156 38 200 38 C244 38 286 58 282 150 Z" fill="#17181d"/>
    <path d="M200 40 V132" stroke="#2c2e36" stroke-width="2" opacity="0.8"/>
    <circle cx="200" cy="40" r="4" fill="#2c2e36"/>
    <path d="M186 84 h28 v7 h-21 v6 h18 v7 h-18 v6 h21 v7 h-28 z" fill="#ffffff"/>
    <path d="M110 142 Q200 168 290 142 Q200 120 110 142 Z" fill="#0c0c10"/>
    <path d="M122 142 Q200 160 278 142" fill="none" stroke="#2c2e36" stroke-width="2" opacity="0.7"/>

    <!-- eyebrows -->
    <g class="brows">
      <path d="M146 168 Q165 158 188 166" fill="none" stroke="#1a1512" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M212 166 Q235 158 254 168" fill="none" stroke="#1a1512" stroke-width="5.5" stroke-linecap="round"/>
    </g>

    <!-- eyes -->
    <g class="eyes">
      <ellipse cx="167" cy="186" rx="14" ry="7.5" fill="#fbf7f2"/>
      <ellipse cx="233" cy="186" rx="14" ry="7.5" fill="#fbf7f2"/>
      <circle cx="168" cy="186" r="6.4" fill="#3b2418"/>
      <circle cx="234" cy="186" r="6.4" fill="#3b2418"/>
      <circle cx="168" cy="186" r="2.8" fill="#0d0907"/>
      <circle cx="234" cy="186" r="2.8" fill="#0d0907"/>
      <circle cx="170" cy="184" r="1.4" fill="#fff"/>
      <circle cx="236" cy="184" r="1.4" fill="#fff"/>
    </g>

    <!-- rimless glasses with gold top bar -->
    <rect x="141" y="170" width="52" height="34" rx="11" fill="#f1dcc0" fill-opacity="0.28"/>
    <rect x="207" y="170" width="52" height="34" rx="11" fill="#f1dcc0" fill-opacity="0.28"/>
    <path d="M140 172 H194" stroke="#d6b56a" stroke-width="3" stroke-linecap="round"/>
    <path d="M206 172 H260" stroke="#d6b56a" stroke-width="3" stroke-linecap="round"/>
    <path d="M194 175 Q200 170 206 175" fill="none" stroke="#d6b56a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M140 172 L128 180" stroke="#d6b56a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M260 172 L272 180" stroke="#d6b56a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M199 192 Q195 222 192 228 Q200 236 208 228 Q205 222 201 192" fill="none" stroke="#b9805c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- goatee and mouth (no mustache) -->
    <g transform="translate(0 8)">
      <path d="M182 262 Q200 292 218 262 Q212 280 200 284 Q188 280 182 262 Z" fill="#241a15" opacity="0.9"/>
      <path d="M182 254 Q200 262 218 254" fill="none" stroke="#8a4b3a" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
